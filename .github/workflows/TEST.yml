name: CI
on: [push]
jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v1
        with:
          go-version: '1.24'
      - name: Set up GolangCI Lint
        run: sudo apt install golangci-lint
      - name: Run linters
        run: golangci-lint run ./...
  test:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v1
        with:
          go-version: '1.24'
      - name: Run tests
        run: go test -race ./...
